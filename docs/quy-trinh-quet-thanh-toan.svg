<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330" font-family="'DejaVu Sans', 'Noto Sans', Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="750" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#1f2937">Quy trình quét hàng và thanh toán · BRG Scan &amp; Checkout</text>
<text x="750" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Khách tự quét hàng trên điện thoại, thanh toán tại quầy bằng Dsmart POS</text>
<rect x="20" y="90" width="470" height="960" rx="16" fill="#FFF3E8" stroke="#E8590C" stroke-width="1.5"/><text x="255" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#E8590C">KHÁCH HÀNG · app BRG trên điện thoại</text><rect x="515" y="90" width="470" height="960" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/><text x="750" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#2563EB">BRG SCAN &amp; CHECKOUT · máy chủ scan.hcrc.vn</text><rect x="1010" y="90" width="470" height="960" rx="16" fill="#E8F6EE" stroke="#2F7D4F" stroke-width="1.5"/><text x="1245" y="122" text-anchor="middle" font-size="17" font-weight="800" fill="#2F7D4F">THU NGÂN · phần mềm Dsmart POS</text><rect x="75" y="150" width="360" height="64" rx="12" fill="#fff" stroke="#E8590C" stroke-width="2.2"/><text x="255" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">1. Mở app, chọn cửa hàng</text><text x="255" y="196" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Vào bằng QR dán ở cửa vào hoặc chọn chi nhánh</text><rect x="75" y="250" width="360" height="84" rx="12" fill="#fff" stroke="#E8590C" stroke-width="2.2"/><text x="255" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">2. Quét mã vạch từng mặt hàng</text><text x="255" y="296" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Giỏ hiện tên, số lượng, giá tạm tính</text><text x="255" y="316" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Lưu cả khi mất mạng, có mạng thì tự đồng bộ</text><rect x="75" y="380" width="360" height="64" rx="12" fill="#fff" stroke="#E8590C" stroke-width="2.2"/><text x="255" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">3. Bấm "Thanh toán"</text><text x="255" y="426" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Giỏ bị khóa, không sửa được nữa</text><rect x="75" y="470" width="360" height="84" rx="12" fill="#fff" stroke="#E8590C" stroke-width="2.2"/><text x="255" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">4. Hiện mã QR giỏ hàng</text><text x="255" y="516" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">BRG2 | mã điểm | mã giỏ | giờ | CRC16</text><text x="255" y="536" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Hiệu lực 30 phút</text><rect x="570" y="380" width="360" height="84" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><text x="750" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Ghi nhận giỏ khi có mạng</text><text x="750" y="426" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Mã giỏ = mã chi nhánh + ký tự ngẫu nhiên</text><text x="750" y="446" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Tính tạm tính theo giá chi nhánh</text><rect x="1065" y="560" width="360" height="84" rx="12" fill="#fff" stroke="#2F7D4F" stroke-width="2.2"/><text x="1245" y="586" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">5. Đưa mã QR cho thu ngân</text><text x="1245" y="606" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Thu ngân quét QR, kiểm tra CRC16</text><text x="1245" y="626" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">và mã điểm đúng cửa hàng</text><rect x="1065" y="680" width="360" height="64" rx="12" fill="#fff" stroke="#2F7D4F" stroke-width="2.2"/><text x="1245" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">6. Gọi API lấy giỏ</text><text x="1245" y="726" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">GET /baskets/{mã giỏ}?pointCode=...</text><rect x="570" y="680" width="360" height="84" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><text x="750" y="706" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Trả danh sách mặt hàng</text><text x="750" y="726" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">sku, barcode, tên, số lượng</text><text x="750" y="746" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">status = awaiting_counter</text><rect x="1065" y="800" width="360" height="84" rx="12" fill="#fff" stroke="#2F7D4F" stroke-width="2.2"/><text x="1245" y="826" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">7. Dựng đơn, tự tính giá và khuyến mãi</text><text x="1245" y="846" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Thu tiền thật (tiền mặt, thẻ, QR, ví...)</text><text x="1245" y="866" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Có thể nhiều hình thức trong một đơn</text><rect x="1025" y="940" width="440" height="104" rx="12" fill="#fff" stroke="#2F7D4F" stroke-width="2.2"/><text x="1245" y="966" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">8. Gọi API báo thanh toán</text><text x="1245" y="986" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">POST /baskets/{mã giỏ}/paid</text><text x="1245" y="1006" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">pointCode, posOrderRef, amount, method hoặc payments,</text><text x="1245" y="1026" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">lines (sku, qty, giá), invoiceUrl (có thể trống)</text><rect x="530" y="940" width="440" height="104" rx="12" fill="#fff" stroke="#2563EB" stroke-width="2.2"/><text x="750" y="966" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Kiểm tra và ghi nhận</text><text x="750" y="986" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Đúng mã điểm, mã đơn không trùng trong cửa hàng</text><text x="750" y="1006" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Ghi khoản thu, lập bill thật, tự dựng link giao dịch</text><text x="750" y="1026" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Báo lại nhiều lần an toàn (không thu trùng)</text><rect x="75" y="940" width="360" height="84" rx="12" fill="#fff" stroke="#2F7D4F" stroke-width="2.2"/><text x="255" y="966" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">9. Màn hình "Đã thanh toán"</text><text x="255" y="986" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Xem bill, tải PDF, gửi email</text><text x="255" y="1006" text-anchor="middle" font-size="14.5" font-weight="400" fill="#1f2937">Khách mang hàng ra về</text><path d="M255 214 L255 250" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M255 334 L255 380" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M255 444 L255 470" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M435 270 L570 270 L570 380" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><text x="502.5" y="262" text-anchor="middle" font-size="13" fill="#b45309" font-weight="700">đồng bộ giỏ</text><path d="M435 510 L1065 580" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M1245 644 L1245 680" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M1065 705 L930 705" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M930 750 L1065 730" stroke="#374151" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1245 744 L1245 800" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M1245 884 L1245 940" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M1025 985 L970 985" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><path d="M530 985 L435 985" stroke="#374151" stroke-width="2.2" fill="none"  marker-end="url(#a)"/><text x="482.5" y="1010" text-anchor="middle" font-size="12" fill="#b45309" font-weight="700">cập nhật</text><rect x="40" y="1070" width="1420" height="215" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/><text x="60" y="1100" font-size="16" font-weight="800" fill="#374151">Tình huống khác</text><text x="64" y="1132" font-size="14.5" fill="#1f2937">• Mất mạng khi quét: giỏ lưu trên điện thoại, có mạng thì tự đồng bộ. POS chưa thấy giỏ (404) thì thử lại sau.</text><text x="64" y="1156" font-size="14.5" fill="#1f2937">• Quá 30 phút chưa thanh toán: mã QR hết hạn, giỏ tự trả lại cho khách. POS báo thanh toán muộn vẫn được ghi nhận (ghi nhật ký).</text><text x="64" y="1180" font-size="14.5" fill="#1f2937">• POS không gọi được BRG: thu ngân vẫn bán, POS thử lại 5 giây, 30 giây, 2 phút, rồi mỗi 5 phút tối đa 24 giờ (cuối ngày hoặc quản lý đẩy tay).</text><text x="64" y="1204" font-size="14.5" fill="#1f2937">• Hóa đơn điện tử phát hành chậm: gửi bổ sung bằng POST /baskets/{mã giỏ}/invoice (invoiceUrl do nhà cung cấp hóa đơn phát hành).</text><text x="64" y="1228" font-size="14.5" fill="#1f2937">• Khách trả hàng: POS gọi POST /baskets/{mã giỏ}/refund (refundRef duy nhất, dòng hoàn theo sku). Bill hiện "Đã hoàn trả" và "Thực thanh toán".</text><text x="64" y="1252" font-size="14.5" fill="#1f2937">• Dsmart POS không dùng /update và /cancelled. Xác thực mọi lệnh gọi bằng header X-Api-Key.</text></svg>